<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les Automates</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* the game fills the whole window; everything else floats over it */
  html, body { height:100%; overflow:hidden; background:#000; }
  body { user-select:none; -webkit-user-select:none; }
  #scene { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; object-fit:cover; image-rendering:auto; border-radius:0; cursor:crosshair; touch-action:none; background:#000; }
  .ov { position:fixed; pointer-events:none; }
  #fps { position:fixed; left:8px; top:8px; }
  body:not(.debug) #fps, body:not(.debug) #stats, body:not(.cine):not(.debug) #home { display:none; }   /* the counters are for the workshop: press ` to see them */
  #stats { left:8px; top:30px; color:#9a9cab; font-size:10px; text-shadow:0 1px 0 #000; }
  #home { position:fixed; right:10px; top:8px; font-size:12px; background:rgba(0,0,0,.55); padding:2px 9px; border-radius:4px; text-decoration:none; z-index:3; }
  #cross { left:50%; top:50%; width:3px; height:3px; background:#fff; box-shadow:0 0 0 1px #000; transform:translate(-50%,-50%); }
  #pain { inset:0; background:#c00; opacity:0; }
  #hit { left:50%; top:50%; width:22px; height:22px; color:#fff; opacity:0; transform:translate(-50%,-50%) rotate(45deg);
    background:linear-gradient(currentColor,currentColor) center/2px 100% no-repeat, linear-gradient(currentColor,currentColor) center/100% 2px no-repeat;
    -webkit-mask:radial-gradient(circle, transparent 4px, #000 5px); mask:radial-gradient(circle, transparent 4px, #000 5px); filter:drop-shadow(0 0 1px #000); }
  #boss { display:none; left:50%; top:14px; width:min(520px, 70vw); height:12px; transform:translateX(-50%); background:rgba(20,14,12,.8); border:2px solid #6e5a3c; border-radius:3px; }
  #boss u { display:block; height:100%; width:100%; background:linear-gradient(#ff6a3a,#b3241a); }
  #boss::after { content:'LE COLOSSE'; position:absolute; left:0; right:0; top:15px; text-align:center; font-size:11px; letter-spacing:4px; color:#ffcf5c; text-shadow:0 1px 0 #000; }
  #bar small b { color:#ffcf5c; }
  #tag { left:0; right:0; top:calc(50% + 34px); text-align:center; opacity:0; transition:opacity .12s; font-size:clamp(11px,1.5vw,15px); letter-spacing:3px; text-shadow:0 1px 0 #000, 0 0 8px #000; z-index:2; }
  #tag i { display:block; width:86px; height:4px; margin:4px auto 0; background:rgba(0,0,0,.55); border:1px solid rgba(0,0,0,.8); } #tag u { display:block; height:100%; }
  #cap { left:0; right:0; bottom:13vh; text-align:center; color:#ffe9a0; font-size:clamp(15px,2.6vw,26px); letter-spacing:5px; text-shadow:0 2px 0 #000, 0 0 12px #000; z-index:2; }
  /* the title and the opening: no status bar, letterbox bars, and the level showing through behind the words */
  .cine #bar, .cine #cross, .cine #touch, .cine #log, .cine #fps, .cine #stats { display:none; }
  .cine::before, .cine::after { content:''; position:fixed; left:0; right:0; height:9vh; background:#000; z-index:1; pointer-events:none; }
  .cine::before { top:0; } .cine::after { bottom:0; }
  .cine #screen { background:radial-gradient(ellipse at center, rgba(10,8,12,.5), rgba(10,8,12,.86)); }
  #dmg { left:50%; top:50%; width:0; height:0; }
  #dmg i { position:absolute; left:-120px; top:-120px; width:240px; height:240px; box-sizing:border-box; border-radius:50%; border:10px solid transparent; border-top-color:rgba(255,64,44,.92); filter:blur(1.5px); opacity:0; }
  #log { left:18px; top:16px; color:#f3e2b0; font:600 13px/1.5 Georgia, 'Times New Roman', serif; font-style:italic; letter-spacing:.3px; text-shadow:0 1px 0 #000, 0 0 6px #000; white-space:pre-line; }
  #bar { position:fixed; left:50%; bottom:max(10px, env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(620px, calc(100vw - 16px)); display:grid; grid-template-columns:1fr 1fr auto 1fr 1fr; align-items:end; gap:0; padding:6px 10px 5px; font-weight:800; pointer-events:none;
    background:linear-gradient(rgba(14,11,10,0), rgba(14,11,10,.72) 45%); border-bottom:2px solid #c9a23a; border-radius:0 0 4px 4px; }
  #bar div { text-align:center; padding:0 0 2px; color:#f1e7cf; font-size:clamp(17px,3vw,28px); line-height:1; text-shadow:0 2px 0 #000, 0 0 10px rgba(0,0,0,.8); border-left:1px solid rgba(201,162,58,.25); }
  #bar div:first-child { border-left:0; }
  #bar small { display:block; font-size:9px; letter-spacing:2px; color:#c9a23a; font-weight:600; margin-top:4px; text-shadow:0 1px 0 #000; }
  #face { width:clamp(34px,6vw,52px); height:auto; image-rendering:pixelated; margin:0 8px; border:2px solid #c9a23a; border-radius:50%; background:#1c1713; box-shadow:0 2px 8px rgba(0,0,0,.7); }
  #keys i { display:inline-block; width:8px; height:14px; margin:0 2px 2px; border:1px solid rgba(201,162,58,.5); border-radius:1px; background:transparent; vertical-align:middle; }
  #screen { inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:rgba(10,8,12,.8); color:#e8e6df; pointer-events:auto; cursor:pointer; padding:16px; z-index:2; }
  #screen h2 { margin:0 0 6px; font-size:clamp(26px,6vw,56px); color:#ffcf5c; letter-spacing:4px; }
  #screen p { margin:5px 0; color:#c9c2b2; max-width:60ch; font-size:13px; }
  #screen b { color:#ffcf5c; }
  #screen .keys { color:#9a9cab; font-size:12px; margin-top:12px; }
  #touch { position:fixed; left:0; right:0; bottom:calc(max(8px, env(safe-area-inset-bottom)) + 62px); display:none; justify-content:space-between; padding:0 10px; gap:8px; z-index:1; }
  #touch div { display:flex; gap:6px; }
  #touch button { width:48px; height:54px; font-size:18px; border-radius:10px; touch-action:none; padding:0; opacity:.85; }
  #touch button.down { background:var(--acc); color:#1a1300; }
  #touch #tfire { width:66px; background:#7a2a22; }
  @media (pointer:coarse) { #touch { display:flex; } #screen .keys { display:none; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<span id="fps"></span>
<span id="stats" class="ov"></span>
<a id="home" href="../">&larr; playground</a>
<span id="cross" class="ov"></span>
<span id="hit" class="ov"></span>
<div id="boss" class="ov"><u></u></div>
<div id="dmg" class="ov"><i></i><i></i><i></i><i></i></div>
<span id="log" class="ov"></span>
<div id="cap" class="ov"></div>
<div id="tag" class="ov"></div>
<span id="pain" class="ov"></span>
<div id="bar">
  <div><span id="ammo">0</span><small>MUNITIONS &middot; GRENADES <b id="nades">0</b></small></div>
  <div><span id="health">100</span>%<small>SANT&Eacute;</small></div>
  <canvas id="face" width="24" height="24"></canvas>
  <div><span id="armour">0</span>%<small>ARMURE</small></div>
  <div><span id="keys"><i id="kb"></i><i id="kr"></i></span><small id="wname">ARME</small></div>
</div>
<div id="touch">
  <div><button data-k="arrowleft">&#8630;</button><button data-k="arrowright">&#8631;</button><button data-k="w">&#9650;</button><button data-k="s">&#9660;</button></div>
  <div><button data-k="next">&#8645;</button><button id="tfire" data-k=" ">FEU</button></div>
</div>
<div id="screen" class="ov"></div>
<script>window.ALL_MODELS = true;</script>
<script src="../shared/sim.js"></script>
<script>
  // The picture is drawn at the window's own shape (up to 1280 wide) and stretched to fill it.
  { const c = document.getElementById('scene'), k = Math.min(Math.min(devicePixelRatio || 1, 2), 1600 / innerWidth, Math.sqrt(1.9e6 / (innerWidth * innerHeight)));   // the screen's own pixels, up to 1600 across and 1.9 million in all: a sharp picture on a dense display
    c.width = Math.round(innerWidth * k / 2) * 2; c.height = Math.round(innerHeight * k / 2) * 2;
    Object.assign(FP, { eye: 16, focal: Math.max(c.width, c.height * 1.25) * 0.625, near: 1, far: 520, fog0: 24, fog: [15, 13, 22] }); }
</script>
<script src="../shared/voxel.js"></script>
<script src="render.js"></script>
<script src="sound.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
