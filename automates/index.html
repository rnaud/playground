<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les Automates</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* the game fills the whole window; everything else floats over it */
  html, body { height:100%; overflow:hidden; background:#000; }
  body { user-select:none; -webkit-user-select:none; }
  #scene { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; object-fit:cover; image-rendering:auto; border-radius:0; cursor:crosshair; touch-action:none; background:#000; }
  .ov { position:fixed; pointer-events:none; }
  #fps { position:fixed; left:8px; top:8px; }
  #stats { left:8px; top:30px; color:#9a9cab; font-size:10px; text-shadow:0 1px 0 #000; }
  #home { position:fixed; right:10px; top:8px; font-size:12px; background:rgba(0,0,0,.55); padding:2px 9px; border-radius:4px; text-decoration:none; z-index:3; }
  #cross { left:50%; top:50%; width:3px; height:3px; background:#fff; box-shadow:0 0 0 1px #000; transform:translate(-50%,-50%); }
  #pain { inset:0; background:#c00; opacity:0; }
  #log { left:10px; top:52px; color:#ffe9a0; font-size:13px; text-shadow:0 1px 0 #000, 0 0 4px #000; white-space:pre-line; }
  #bar { position:fixed; left:50%; bottom:max(8px, env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(680px, calc(100vw - 16px)); display:grid; grid-template-columns:1fr 1fr auto 1fr 1fr; gap:2px; background:rgba(58,48,40,.9); border:2px solid #6e5a3c; border-radius:6px; padding:3px; font-weight:800; pointer-events:none; }
  #bar div { background:#1c1713; border:2px solid #0d0a08; border-right-color:#5a4a36; border-bottom-color:#5a4a36; text-align:center; padding:2px 0 3px; color:#e0483a; font-size:clamp(15px,3.4vw,26px); line-height:1; }
  #bar small { display:block; font-size:9px; letter-spacing:1px; color:#b9a37a; font-weight:400; margin-top:3px; }
  #face { width:clamp(34px,7vw,56px); height:auto; image-rendering:pixelated; background:#1c1713; border:2px solid #0d0a08; border-radius:0; }
  #keys i { display:inline-block; width:9px; height:15px; margin:0 2px; border:1px solid #0d0a08; background:#2a221b; vertical-align:middle; }
  #screen { inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:rgba(10,8,12,.8); color:#e8e6df; pointer-events:auto; cursor:pointer; padding:16px; z-index:2; }
  #screen h2 { margin:0 0 6px; font-size:clamp(26px,6vw,56px); color:#ffcf5c; letter-spacing:4px; }
  #screen p { margin:5px 0; color:#c9c2b2; max-width:60ch; font-size:13px; }
  #screen b { color:#ffcf5c; }
  #screen .keys { color:#9a9cab; font-size:12px; margin-top:12px; }
  #touch { position:fixed; left:0; right:0; bottom:calc(max(8px, env(safe-area-inset-bottom)) + 62px); display:none; justify-content:space-between; padding:0 10px; gap:8px; z-index:1; }
  #touch div { display:flex; gap:6px; }
  #touch button { width:48px; height:54px; font-size:18px; border-radius:10px; touch-action:none; padding:0; opacity:.85; }
  #touch button.down { background:var(--acc); color:#1a1300; }
  #touch #tfire { width:66px; background:#7a2a22; }
  @media (pointer:coarse) { #touch { display:flex; } #screen .keys { display:none; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<span id="fps"></span>
<span id="stats" class="ov"></span>
<a id="home" href="../">&larr; playground</a>
<span id="cross" class="ov"></span>
<span id="log" class="ov"></span>
<span id="pain" class="ov"></span>
<div id="bar">
  <div><span id="ammo">0</span><small>MUNITIONS</small></div>
  <div><span id="health">100</span>%<small>SANT&Eacute;</small></div>
  <canvas id="face" width="24" height="24"></canvas>
  <div><span id="armour">0</span>%<small>ARMURE</small></div>
  <div><span id="keys"><i id="kb"></i><i id="kr"></i></span><small id="wname">ARME</small></div>
</div>
<div id="touch">
  <div><button data-k="arrowleft">&#8630;</button><button data-k="arrowright">&#8631;</button><button data-k="w">&#9650;</button><button data-k="s">&#9660;</button></div>
  <div><button data-k="next">&#8645;</button><button id="tfire" data-k=" ">FEU</button></div>
</div>
<div id="screen" class="ov"></div>
<script>window.ALL_MODELS = true;</script>
<script src="../shared/sim.js"></script>
<script>
  // The picture is drawn at the window's own shape (up to 1280 wide) and stretched to fill it.
  { const c = document.getElementById('scene'), k = Math.min(1, 1280 / innerWidth);
    c.width = Math.round(innerWidth * k / 2) * 2; c.height = Math.round(innerHeight * k / 2) * 2;
    Object.assign(FP, { eye: 9, focal: c.width * 0.625, near: 1, far: 340, fog0: 24, fog: [15, 13, 22] }); }
</script>
<script src="../shared/voxel.js"></script>
<script src="render.js"></script>
<script src="sound.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
